services:
  app:
    build: ..
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      DATA_DIR: /app/data
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
    expose:
      - "3210"
    volumes:
      - render-data:/app/data
    restart: unless-stopped
  caddy:
    image: caddy:2.11.9-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  render-data:
  caddy-data:
  caddy-config:
