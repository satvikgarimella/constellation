# One coordinator: rooms and render jobs live in this process's memory.
services:
  - type: web
    name: constellation
    runtime: node
    plan: free
    region: ohio
    numInstances: 1
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npx --yes pnpm@11.25.0 install --prod --frozen-lockfile
    startCommand: PUBLIC_URL="${PUBLIC_URL:-$RENDER_EXTERNAL_URL}" node --env-file-if-exists=/etc/secrets/constellation.env server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: ./data
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
